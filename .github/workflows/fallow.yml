name: Fallow

# Codebase intelligence (unused code, duplication, complexity, maintainability).
# REPORT-ONLY: this workflow never fails the build. It surfaces Fallow's scores
# on every push/PR so we can keep an eye on the trend. To turn it into a gate
# later, switch to a saved baseline (`fallow --baseline`) and fail on NEW issues.
#
# Ported from the company's DELF repository. The one change is the trunk: audits
# are taken against `develop`, which is this repository's integration branch and
# the base of every feature pull request.

on:
  push:
    branches:
      - main
      - staging
      - develop
  pull_request:
    # No `synchronize`, deliberately (the CI diet): this workflow is
    # report-only — it can gate nothing — so re-scoring every push to a PR
    # spent minutes repainting a number nobody acts on mid-branch. One score
    # when the PR opens is the useful one, and the trunk pushes above keep the
    # trend. The full-history checkout below makes each run one of the more
    # expensive in the repo, which is why this workflow went on the diet and
    # the build gate did not.
    #
    # Since #232 each run also installs and runs the unit suite — twice on a
    # PR, once per tree, so both columns of the table are scored on measured
    # coverage rather than a guess. That is ~25 s of tests and a cached
    # install per tree, accepted: it is what makes the hotspot column mean
    # something, and the diet above is what keeps it to one run per PR.
    types: [opened, reopened, ready_for_review]

# Avoid piling up runs on rapid pushes to the same ref.
concurrency:
  group: fallow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The analyzer is a pinned devDependency (`fallow` in package.json, exact), so
# the version the workflow scores with is the one `pnpm fallow` scores with —
# one number to bump, and the numbers cannot drift between the two.

jobs:
  fallow:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    name: Codebase Intelligence
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post/update the PR comment
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `fallow audit` can diff the PR against its base ref.
          fetch-depth: 0
          # Check out the PR's head commit (not the default merge commit) so the
          # "changed files" diff matches what a dev sees locally on their branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # Fallow reads source and needs no node_modules of its own — but the
      # coverage it is handed does. Two of the three inputs to a "hotspot" are
      # read off the code; the third, CRAP (complexity² × (1 − coverage)), is
      # estimated from the module graph unless a coverage map is supplied, and
      # the estimate read "untested" for functions with a 5 000-line test
      # file. So the unit suite runs under c8 here and the Istanbul map is
      # passed with `--coverage`. Coverage is best-effort: a run that fails
      # leaves that tree scored on the estimate, and the summary says which.
      - run: pnpm install --frozen-lockfile

      - name: Run Fallow
        id: fallow
        continue-on-error: true # report-only — never break the build
        run: |
          set +e
          # Coverage for the tree under test. `coverage/` is gitignored.
          # Why a tree fell back to the estimate is written to coverage-notes.txt,
          # which the summary prints: "estimated" alone cannot tell a failing
          # suite on the base from a base that predates `test:coverage`.
          : > coverage-notes.txt
          COVERAGE_ARG=""
          if pnpm test:coverage >coverage-head.log 2>&1 && [ -s coverage/coverage-final.json ]; then
            COVERAGE_ARG="--coverage coverage/coverage-final.json"
          else
            echo "After (this branch): coverage run failed — $(grep -m1 -E 'fail [1-9]|ERR|Error|not found' coverage-head.log || echo 'see the job log') — scored on the estimate." >> coverage-notes.txt
          fi

          # The binary, not `pnpm exec`: pnpm checks node_modules against the
          # lockfile before running anything and, finding it stale, reinstalls
          # — onto stdout, into the JSON. Nothing but Fallow may write there.
          FALLOW=./node_modules/.bin/fallow

          # Whole-project scores (pre-existing context).
          $FALLOW --format json --quiet $COVERAGE_ARG > fallow.json 2>/dev/null
          $FALLOW health --format badge --quiet $COVERAGE_ARG > fallow-badge.svg 2>/dev/null

          # On PRs, add two base-relative views:
          #   1. audit  → findings introduced vs inherited in changed files
          #   2. base.json → whole-project scan at the merge-base, so the report
          #      can show a Before/After delta (and surface REMOVED issues).
          AUDIT_ARG=""
          BASE_ARG=""
          BASE_BADGE_ARG=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$GITHUB_BASE_REF" ]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF" >/dev/null 2>&1
            $FALLOW audit --base "origin/${GITHUB_BASE_REF}" \
              --format json --quiet $COVERAGE_ARG > audit.json 2>/dev/null
            [ -s audit.json ] && AUDIT_ARG="audit.json"

            # Analyze the branch point in a throwaway worktree for the
            # Before/After delta, including the composite health grade. The
            # base gets its OWN coverage, from its own tests, so both columns
            # are measured the same way — and its own install, from the pnpm
            # store the head's install just filled. Not a symlink to the
            # head's node_modules: pnpm verifies node_modules against the
            # lockfile before every run, and through a link it "repairs" the
            # head's install to the base's lockfile, taking c8 and fallow
            # with it. Measured once, on this very PR.
            BASE_SHA=$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)
            if [ -n "$BASE_SHA" ]; then
              BASE_TREE="$(mktemp -d)"
              if git worktree add --detach "$BASE_TREE" "$BASE_SHA" >/dev/null 2>&1; then
                BASE_COVERAGE_ARG=""
                if (cd "$BASE_TREE" && pnpm install --frozen-lockfile >coverage-base.log 2>&1 && pnpm test:coverage >>coverage-base.log 2>&1) && [ -s "$BASE_TREE/coverage/coverage-final.json" ]; then
                  BASE_COVERAGE_ARG="--coverage $BASE_TREE/coverage/coverage-final.json"
                elif ! grep -q '"test:coverage"' "$BASE_TREE/package.json"; then
                  echo "Before (\`$GITHUB_BASE_REF\`): predates \`pnpm test:coverage\` — scored on the estimate." >> coverage-notes.txt
                else
                  echo "Before (\`$GITHUB_BASE_REF\`): coverage run failed — $(grep -m1 -E 'fail [1-9]|ERR|Error' coverage-base.log || echo 'see the job log') — scored on the estimate." >> coverage-notes.txt
                fi
                $FALLOW --format json --quiet --root "$BASE_TREE" $BASE_COVERAGE_ARG > base.json 2>base.err
                $FALLOW health --format badge --quiet --root "$BASE_TREE" $BASE_COVERAGE_ARG > base-badge.svg 2>>base.err
                git worktree remove "$BASE_TREE" --force >/dev/null 2>&1
                [ -s base.json ] && BASE_ARG="base.json"
                [ -s base-badge.svg ] && BASE_BADGE_ARG="base-badge.svg"
              fi
            fi
          fi

          # What the step produced, in the job log — every command above writes
          # to a file, so without this a base run that failed leaves no trace.
          echo "::group::Fallow outputs"
          wc -c fallow.json fallow-badge.svg audit.json base.json base-badge.svg coverage-notes.txt 2>/dev/null
          [ -s coverage-notes.txt ] && cat coverage-notes.txt
          [ -s base.err ] && { echo "--- base run stderr:"; tail -n 20 base.err; }
          for f in fallow.json base.json audit.json; do
            [ -s "$f" ] && ! node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" 2>/dev/null               && { echo "--- $f is not JSON; first and last 200 bytes:"; head -c 200 "$f"; echo; tail -c 200 "$f"; echo; }
          done
          echo "::endgroup::"

          node scripts/fallow-ci-summary.mjs fallow.json fallow-badge.svg "$AUDIT_ARG" "$BASE_ARG" "$BASE_BADGE_ARG" coverage-notes.txt >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: always()
        run: |
          if [ -f fallow-report.md ]; then
            cat fallow-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Fallow produced no report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- fallow-intelligence-comment -->';
            let report = '';
            try { report = fs.readFileSync('fallow-report.md', 'utf8'); } catch {}

            const body = `${marker}\n## Codebase Intelligence (Fallow)\n\n${report}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            // Delete any prior Fallow comments and post a fresh one, so the
            // latest result always lands at the bottom of the PR (most visible)
            // instead of staying edited-in-place at its original position.
            const stale = comments.filter(c =>
              c.user?.login === 'github-actions[bot]' && c.body.includes(marker)
            );
            for (const c of stale) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: c.id,
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
