name: Constraints

# The enforcement half of #77's probe (#125): on any change that could move a
# CHECK constraint, compare the live database's constraints against what
# `schema.ts` declares, word for word, and fail naming the rule. The probe
# itself is `pnpm verify:constraints` — the constraints slice of `verify:db`,
# which creates short-lived mirror tables, reads `pg_get_constraintdef` for
# both sides, and writes nothing else; see `src/lib/db/constraint-drift.ts`
# for why nothing in it parses SQL.
#
# The paths filter keeps this off the pull requests that cannot cause drift.
# It includes the probe's own files, so a change to the guard exercises the
# guard.

on:
  push:
    branches:
      - main
      - staging
      - develop
    paths:
      - src/lib/db/schema.ts
      - src/lib/db/constraint-drift.ts
      - drizzle/**
      - scripts/verify-constraints.ts
      - .github/workflows/constraints.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - src/lib/db/schema.ts
      - src/lib/db/constraint-drift.ts
      - drizzle/**
      - scripts/verify-constraints.ts
      - .github/workflows/constraints.yml

concurrency:
  group: constraints-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    name: Live CHECK constraints match the schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # A missing secret FAILS rather than skips, on purpose: a guard that
      # quietly stands down when unconfigured is the comment-shaped failure
      # this workflow exists to retire. The secret should point at a standing
      # development branch — never production; the probe creates and drops
      # uniquely-suffixed mirror tables and reads the catalog, nothing else,
      # so concurrent runs against the same branch do not collide.
      - name: Probe the live constraints
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The DATABASE_URL repository secret is not set. Add one pointing at a Neon development branch (Settings → Secrets and variables → Actions) so schema changes are probed against a real database."
            exit 1
          fi
          pnpm verify:constraints
