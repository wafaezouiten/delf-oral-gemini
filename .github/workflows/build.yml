name: Build

# The single quality gate: lint, typecheck, unit tests and a production build in
# one job, so the pull request shows one check — "Build / Lint, typecheck, unit
# tests & build" — exactly as the company's DELF repository does.
#
# Prettier is the one step of the reference job that is absent: this repository
# has no Prettier config and no format script. Add `pnpm format:check` here the
# day it does.

on:
  push:
    branches:
      - main
      - staging
      - develop
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel an in-flight run when a newer commit lands on the same ref, so rapid
# pushes don't pile up redundant CI.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    name: Lint, typecheck, unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Reuse Next.js's compiler cache across runs to speed up `next build`.
      # Keyed on the lockfile + source so unrelated runs still hit the cache,
      # with progressively looser restore-keys for a partial (warm) restore.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-
      - name: ESLint
        run: pnpm lint
      # `pnpm typecheck` is `next typegen && tsc --noEmit`: Next 16 generates the
      # PageProps / LayoutProps globals into .next/types during dev or build, so
      # a bare tsc passes locally and fails on a cold checkout.
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      # No secrets: every route is server-rendered on demand, so nothing
      # prerenders behind Clerk. Verified by building with .env.local removed.
      - name: Build
        run: pnpm build
