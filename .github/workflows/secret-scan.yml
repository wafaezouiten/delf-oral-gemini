name: Secret Scan

# Detects API keys, tokens and credentials before they reach a protected branch.
#
# GitHub's own secret scanning is not available here: this repository is private
# on a Free plan, where scanning + push protection require GitHub Advanced
# Security (or a public repository). Gitleaks gives the same gate in CI and is
# what the branch protection rules list as a required check. If the repository
# ever goes public or onto a paid plan, enable GitHub secret scanning as well —
# the two are complementary, not redundant.
#
# The binary is pinned and fetched from the release page rather than using a
# third-party action, so the gate cannot silently change under us.

on:
  push:
    branches:
      - main
      - staging
      - develop
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: Secret scan
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the pull request's own commits can be scanned — a
          # secret that was committed and then deleted still leaks.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # 1. The tree as it stands: anything checked in right now.
      - name: Scan working tree
        run: gitleaks dir . --redact --verbose --no-banner

      # 2. The commits this pull request adds, including anything a later commit
      #    removed. Skipped on push events, where step 1 is the meaningful check.
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          BASE="$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" HEAD)"
          gitleaks git . --redact --verbose --no-banner --log-opts="${BASE}..HEAD"

      - name: Result
        if: failure()
        run: |
          echo "::error::Gitleaks found a potential secret. Rotate the credential first — deleting the commit does not un-leak it — then remove it from the history and re-push. If it is a false positive, add a narrow allowlist entry to .gitleaks.toml with a comment saying why."
