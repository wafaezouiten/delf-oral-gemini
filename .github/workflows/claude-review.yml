name: Claude Code Review

# One automatic review per pull request, then on demand. This used to mirror
# the company's DELF repository — a fresh review on EVERY push — and that is
# what emptied the account's 2,000 free Actions minutes 25 days into August:
# an agentic review is minutes long, and this repository's working style pushes
# to a PR many times. The month's whole allowance went to re-reviewing
# work-in-progress states nobody asked about.
#
# So: the review runs once, when the PR opens (or leaves draft) — and again
# whenever somebody asks, by adding the `claude-review` label. Remove the label
# and add it back to ask twice. `@claude` mentions in comments keep working
# independently of this (see claude.yml); what changed is only what runs
# unprompted.

on:
  pull_request:
    types: [opened, ready_for_review, labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The job id is the check name. Left un-named on purpose so the pull request
  # shows "Claude Code Review / claude-review", matching the DELF repository.
  claude-review:
    # The label gate only applies to label events: any label other than
    # `claude-review` must not trigger a review, but `opened` and
    # `ready_for_review` carry no label at all and pass straight through.
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      # The token is a repository secret that has to be minted by a human
      # (`claude setup-token`). Until it exists, warn and skip rather than fail
      # every pull request with a red X. See docs/ENGINEERING_WORKFLOW.md.
      #
      # A job reads secrets when it starts, so a run queued BEFORE the secret was
      # added keeps reporting it missing however many times you look at it. Push
      # again or re-run the workflow; the warning names this case because it is
      # the one that looks like a bug and is not.
      - name: Check for Claude credentials
        id: creds
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set — skipping the Claude review. Mint it with 'claude setup-token' and add it under Settings → Secrets and variables → Actions. If you just added it, this run started before it existed: re-run the workflow or push again."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.creds.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        if: steps.creds.outputs.configured == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Architecture: does the change sit at the right layer, and does it
              respect the boundary between the pure DELF logic in `src/lib/delf`
              and everything with I/O (Gemini Live, Clerk, Neon, routes, UI)?
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns — leaked credentials, a server-only key reaching
              the browser, missing auth on a route, unvalidated input
            - Test coverage

            Use the repository's CLAUDE.md and AGENTS.md for guidance on style and
            conventions — note that this project pins a Next.js version whose APIs
            differ from what you may remember, so check `node_modules/next/dist/docs/`
            before asserting that Next.js code is wrong.

            Be constructive and specific: point at lines, and say what to do instead.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
