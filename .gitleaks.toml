# Gitleaks configuration — see .github/workflows/secret-scan.yml
#
# Start from the upstream rule set (AWS, GCP, Google/Gemini API keys, Clerk,
# Stripe, generic high-entropy assignments, private keys, …) and add only narrow,
# justified allowlist entries below. Every entry needs a comment saying why it is
# not a real credential.

[extend]
useDefault = true

[[allowlists]]
description = "Placeholders and lockfile integrity hashes — no real credentials"
paths = [
  # Documents which variables exist; every value is intentionally empty.
  '''^\.env\.example$''',
  # Base64 integrity digests read as high-entropy strings.
  '''^pnpm-lock\.yaml$''',
]
